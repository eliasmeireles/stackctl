# =============================================================================
# CREDENTIALS MANAGEMENT CONFIGURATION
# =============================================================================
# This file demonstrates how to manage database and message broker users
# and credentials declaratively using stackctl.
#
# Usage:
#   stackctl credentials apply -f credentials-config.yaml
#
# Features:
#   - Create users in PostgreSQL, MySQL, MongoDB
#   - Create users in RabbitMQ message broker
#   - Auto-generate secure passwords or specify custom ones
#   - Grant specific privileges (read-only, read-write, admin)
#   - Store credentials in Vault automatically
#   - Resolve admin credentials from Vault, env vars, or explicit values
# =============================================================================

# =============================================================================
# DATABASES
# =============================================================================
databases:
  add:
    # PostgreSQL Examples
    - type: postgresql
      host: postgres.example.com
      port: 5432
      database: myapp_production
      
      admin_user: postgres
      admin_pass: supersecret
      
      username: app_readonly
      password: custom_password_123
      privileges:
        - read
      
      vault_path: secret/data/databases/myapp/readonly
    
    - type: postgresql
      host: localhost
      port: 30432
      database: test_db
      
      admin_vault_path: secret/data/databases/admin/postgres/prod
      
      username: test_admin
      auto_generate_pass: true
      privileges:
        - admin
      
      vault_path: secret/data/databases/test/admin

    # MySQL Examples
    - type: mysql
      host: mysql.example.com
      port: 3306
      database: wordpress
      
      admin_user: root
      admin_pass: ${MYSQL_ROOT_PASSWORD}
      
      username: wp_user
      auto_generate_pass: true
      privileges:
        - read
        - write
      
      vault_path: secret/data/databases/wordpress/app

    # MongoDB Examples
    - type: mongodb
      host: mongodb.example.com
      port: 27017
      database: ecommerce
      
      admin_user: admin
      admin_pass: ${MONGO_ADMIN_PASSWORD}
      
      username: ecommerce_app
      auto_generate_pass: true
      privileges:
        - read
        - write
      
      vault_path: secret/data/databases/ecommerce/app

  remove:
    - type: postgresql
      host: postgres.example.com
      port: 5432
      database: old_app
      
      admin_vault_path: secret/data/databases/admin/postgres/prod
      
      username: deprecated_user

# =============================================================================
# MESSAGE BROKERS
# =============================================================================
message_brokers:
  add:
    # RabbitMQ Examples
    - type: rabbitmq
      host: rabbitmq.example.com
      port: 5672
      vhost: /production
      
      admin_user: admin
      admin_pass: ${RABBITMQ_ADMIN_PASSWORD}
      
      username: producer_app
      auto_generate_pass: true
      privileges:
        - write                       # Can publish messages
      
      vault_path: secret/data/messaging/rabbitmq/producer
    
    - type: rabbitmq
      host: rabbitmq.example.com
      port: 5672
      vhost: /production
      
      admin_vault_path: secret/data/messaging/admin/rabbitmq/prod
      
      username: consumer_app
      auto_generate_pass: true
      privileges:
        - read                        # Can consume messages
      
      vault_path: secret/data/messaging/rabbitmq/consumer
    
    - type: rabbitmq
      host: localhost
      port: 30672
      vhost: /dev
      
      admin_user: admin
      admin_pass: admin123
      
      username: dev_full_access
      auto_generate_pass: true
      privileges:
        - read
        - write
        - admin                       # Full management access
      
      vault_path: secret/data/messaging/rabbitmq/dev/admin

  remove:
    - type: rabbitmq
      host: rabbitmq.example.com
      port: 5672
      vhost: /staging
      
      admin_vault_path: secret/data/messaging/admin/rabbitmq/prod
      
      username: test_user

# =============================================================================
# PRIVILEGE REFERENCE
# =============================================================================
# 
# PostgreSQL:
#   - read:  SELECT on all tables in the database
#   - write: SELECT, INSERT, UPDATE, DELETE on all tables
#   - admin: ALL PRIVILEGES on the database
#
# MySQL:
#   - read:  SELECT on the database
#   - write: SELECT, INSERT, UPDATE, DELETE on the database
#   - admin: ALL PRIVILEGES on the database
#
# MongoDB:
#   - read:  read role on the database
#   - write: readWrite role on the database
#   - admin: dbAdmin role on the database
#
# RabbitMQ:
#   - read:  Can consume messages from queues in the vhost
#   - write: Can publish messages to exchanges in the vhost
#   - admin: Full management access (configure, read, write)
#
# =============================================================================
# ADMIN CREDENTIALS RESOLUTION ORDER
# =============================================================================
#
# stackctl resolves admin credentials in the following priority:
#
# 1. Explicit values (admin_user + admin_pass)
# 2. Environment variables (${VAR_NAME})
# 3. Vault path (admin_vault_path)
#
# =============================================================================
