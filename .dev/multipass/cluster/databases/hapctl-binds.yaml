binds:
  # PostgreSQL
  - name: postgres-db
    enabled: true
    override: true
    description: "PostgreSQL database for stackctl testing"
    type: tcp
    ip: "*"
    port: 5432
    backend:
      servers:
        - name: postgres
          address: postgres.databases.svc.cluster.local:5432

  # MySQL
  - name: mysql-db
    enabled: true
    override: true
    description: "MySQL database for stackctl testing"
    type: tcp
    ip: "*"
    port: 3306
    backend:
      servers:
        - name: mysql
          address: mysql.databases.svc.cluster.local:3306

  # MongoDB
  - name: mongodb-db
    enabled: true
    override: true
    description: "MongoDB database for stackctl testing"
    type: tcp
    ip: "*"
    port: 27017
    backend:
      servers:
        - name: mongodb
          address: mongodb.databases.svc.cluster.local:27017

  # RabbitMQ AMQP
  - name: rabbitmq-amqp
    enabled: true
    override: true
    description: "RabbitMQ AMQP for stackctl testing"
    type: tcp
    ip: "*"
    port: 5672
    backend:
      servers:
        - name: rabbitmq
          address: rabbitmq.databases.svc.cluster.local:5672

  # RabbitMQ Management UI
  - name: rabbitmq-management
    enabled: true
    override: true
    description: "RabbitMQ Management UI"
    type: http
    ip: "*"
    port: 15672
    backend:
      servers:
        - name: rabbitmq-mgmt
          address: rabbitmq.databases.svc.cluster.local:15672
