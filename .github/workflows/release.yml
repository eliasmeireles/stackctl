name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"

      - name: Run tests
        run: go test -v ./...

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w \
            -X github.com/eliasmeireles/stackctl/cmd/stackctl/cmd.Version=${VERSION} \
            -X github.com/eliasmeireles/stackctl/cmd/stackctl/cmd.BuildDate=${BUILD_DATE} \
            -X github.com/eliasmeireles/stackctl/cmd/stackctl/cmd.Commit=${COMMIT}"
          GOOS=linux  GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/stackctl-linux-amd64  ./cmd/stackctl
          GOOS=linux  GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/stackctl-linux-arm64  ./cmd/stackctl
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/stackctl-darwin-amd64 ./cmd/stackctl
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/stackctl-darwin-arm64 ./cmd/stackctl

      - name: Create checksums
        run: |
          cd bin
          sha256sum stackctl-* > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/stackctl-linux-amd64
            bin/stackctl-linux-arm64
            bin/stackctl-darwin-amd64
            bin/stackctl-darwin-arm64
            bin/checksums.txt
          draft: false
          # Any tag containing a hyphen (e.g. v0.1.0-rc-1, v0.1.0-beta) is
          # marked as a pre-release so `stackctl self-update` (which only
          # considers ^v\d+\.\d+\.\d+$) skips it by default.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
