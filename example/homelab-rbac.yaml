# Sample homelab RBAC layout: two namespaces, one ServiceAccount in kube-system
# bound to the built-in `edit` ClusterRole in each namespace, and a
# service-account-token Secret so a portable kubeconfig can be generated.
#
# Apply everything:   stackctl vault apply  -f homelab-rbac.yaml
# Revert everything:  stackctl vault revert -f homelab-rbac.yaml
#
# After apply, build a kubeconfig for the dev-user ServiceAccount:
#   stackctl kubeconfig apply -f kubeconfig-from-sa.yaml
#
# (or pass the same fields directly as flags via `stackctl kubeconfig from-sa`)

kubernetes:
  namespaces:
    - name: homelab-dev
    - name: homelab-staging

  service_accounts:
    - name: dev-user
      namespace: kube-system

  secrets:
    - name: dev-user-token
      namespace: kube-system
      type: kubernetes.io/service-account-token
      annotations:
        kubernetes.io/service-account.name: dev-user

  role_bindings:
    - name: dev-user-edit
      namespace: homelab-dev
      role_ref:
        kind: ClusterRole
        name: edit
      subjects:
        - kind: ServiceAccount
          name: dev-user
          namespace: kube-system

    - name: dev-user-edit
      namespace: homelab-staging
      role_ref:
        kind: ClusterRole
        name: edit
      subjects:
        - kind: ServiceAccount
          name: dev-user
          namespace: kube-system
