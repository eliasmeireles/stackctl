# Example configuration for managing Kubernetes service accounts and Vault users
# with their associated policies

# 1. Enable required auth methods
auth:
  enable:
    - type: kubernetes
      path: kubernetes
      description: "Kubernetes auth for service accounts"
    - type: userpass
      path: userpass
      description: "Username/password auth for users"

# 2. Create policies for different access levels
policies:
  add:
    - name: read-secrets
      rules: |
        path "secret/data/*" {
          capabilities = ["read", "list"]
        }

    - name: write-secrets
      rules: |
        path "secret/data/*" {
          capabilities = ["create", "read", "update", "delete", "list"]
        }

    - name: admin-policy
      rules: |
        path "secret/*" {
          capabilities = ["create", "read", "update", "delete", "list"]
        }
        path "sys/policies/*" {
          capabilities = ["create", "read", "update", "delete", "list"]
        }

# 3. Configure Kubernetes service accounts with policies
service_accounts:
  auth_mount: kubernetes
  namespace: default  # Kubernetes namespace
  add:
    - name: app-reader
      policies:
        - read-secrets
      ttl: "1h"
      description: "Service account for reading application secrets"

    - name: app-writer
      policies:
        - write-secrets
      ttl: "2h"
      description: "Service account for managing application secrets"

    - name: ci-pipeline
      policies:
        - write-secrets
        - read-secrets
      ttl: "30m"
      description: "Service account for CI/CD pipelines"

  # Update existing service account bindings
  update:
    - name: app-reader
      policies:
        - read-secrets
        - write-secrets  # Grant additional permissions
      ttl: "2h"

  # Remove service account bindings
  delete:
    - name: old-service-account

# 4. Configure Vault users with policies
users:
  auth_mount: userpass
  add:
    - username: admin-user
      password: "secure-password-123"
      policies:
        - admin-policy
      description: "Administrator user with full access"

    - username: developer
      auto_generate_password: true
      password_size: 20  # 20 bytes = 40 hex chars
      policies:
        - write-secrets
      description: "Developer user with write access"

    - username: readonly-user
      auto_generate_password: true
      policies:
        - read-secrets
      description: "Read-only user for monitoring"

  # Update existing users
  update:
    - username: developer
      password: "new-password-456"
      policies:
        - write-secrets
        - admin-policy  # Promote to admin

  # Delete users
  delete:
    - username: old-user

# 5. Manage secrets (optional - shown for completeness)
secrets:
  path: secret/data/app/config
  description: "Application configuration secrets"
  add:
    - name: API_KEY
      auto_generate: true
      size: 32
      description: "API key for external service"
    - name: DATABASE_URL
      value: "postgresql://localhost:5432/mydb"
      description: "Database connection string"
