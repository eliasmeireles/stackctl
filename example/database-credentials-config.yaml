# =============================================================================
# CREDENTIALS MANAGEMENT CONFIGURATION
# =============================================================================
# This file demonstrates how to manage database and message broker users
# and credentials declaratively using stackctl.
#
# Usage:
#   stackctl credentials apply -f credentials-config.yaml
#
# Features:
#   - Create users in PostgreSQL, MySQL, MongoDB
#   - Create users in RabbitMQ message broker
#   - Auto-generate secure passwords or specify custom ones
#   - Grant specific privileges (read-only, read-write, admin)
#   - Store credentials in Vault automatically
#   - Resolve admin credentials from Vault, env vars, or explicit values
# =============================================================================

databases:
  # =============================================================================
  # ADD/UPDATE DATABASE USERS
  # =============================================================================
  add:
    # ---------------------------------------------------------------------------
    # PostgreSQL Examples
    # ---------------------------------------------------------------------------
    - type: postgresql
      host: postgres.example.com
      port: 5432
      database: myapp_production

      # Admin credentials - Option 1: Explicit (not recommended for production)
      admin_user: postgres
      admin_pass: supersecret

      # User to create
      username: app_readonly
      password: custom_password_123  # Optional: specify password
      privileges:
        - read                        # Grant SELECT on all tables

      # Vault storage (optional)
      vault_path: secret/data/databases/myapp/readonly

    - type: postgresql
      host: postgres.example.com
      port: 5432
      database: myapp_production

      # Admin credentials - Option 2: Environment variables
      admin_user: ${POSTGRES_ADMIN_USER}
      admin_pass: ${POSTGRES_ADMIN_PASS}

      # User to create
      username: app_readwrite
      auto_generate_pass: true        # Auto-generate secure password
      privileges:
        - read
        - write                       # Grant SELECT, INSERT, UPDATE, DELETE

      vault_path: secret/data/databases/myapp/readwrite

    - type: postgresql
      host: localhost
      port: 30432
      database: test_db

      # Admin credentials - Option 3: Vault path (recommended)
      admin_vault_path: secret/data/databases/admin/postgres/prod

      username: test_admin
      auto_generate_pass: true
      privileges:
        - admin                       # Grant ALL PRIVILEGES

      vault_path: secret/data/databases/test/admin

    # ---------------------------------------------------------------------------
    # MySQL Examples
    # ---------------------------------------------------------------------------
    - type: mysql
      host: mysql.example.com
      port: 3306
      database: wordpress

      admin_user: root
      admin_pass: ${MYSQL_ROOT_PASSWORD}

      username: wp_user
      auto_generate_pass: true
      privileges:
        - read
        - write

      vault_path: secret/data/databases/wordpress/app

    - type: mysql
      host: localhost
      port: 30306
      database: analytics

      admin_vault_path: secret/data/databases/admin/mysql/prod

      username: analytics_readonly
      auto_generate_pass: true
      privileges:
        - read

      vault_path: secret/data/databases/analytics/readonly

    # ---------------------------------------------------------------------------
    # MongoDB Examples
    # ---------------------------------------------------------------------------
    - type: mongodb
      host: mongodb.example.com
      port: 27017
      database: ecommerce

      admin_user: admin
      admin_pass: ${MONGO_ADMIN_PASSWORD}

      username: ecommerce_app
      auto_generate_pass: true
      privileges:
        - read
        - write

      vault_path: secret/data/databases/ecommerce/app

    - type: mongodb
      host: localhost
      port: 30017
      database: logs

      admin_vault_path: secret/data/databases/admin/mongodb/prod

      username: logs_reader
      auto_generate_pass: true
      privileges:
        - read

      vault_path: secret/data/databases/logs/reader

    # ---------------------------------------------------------------------------
    # RabbitMQ Examples
    # ---------------------------------------------------------------------------
    - type: rabbitmq
      host: rabbitmq.example.com
      port: 5672
      vhost: /production              # RabbitMQ virtual host

      admin_user: admin
      admin_pass: ${RABBITMQ_ADMIN_PASSWORD}

      username: producer_app
      auto_generate_pass: true
      privileges:
        - write                       # Can publish messages

      vault_path: secret/data/messaging/rabbitmq/producer

    - type: rabbitmq
      host: rabbitmq.example.com
      port: 5672
      vhost: /production

      admin_vault_path: secret/data/databases/admin/rabbitmq/prod

      username: consumer_app
      auto_generate_pass: true
      privileges:
        - read                        # Can consume messages

      vault_path: secret/data/messaging/rabbitmq/consumer

    - type: rabbitmq
      host: localhost
      port: 30672
      vhost: /dev

      admin_user: admin
      admin_pass: admin123

      username: dev_full_access
      auto_generate_pass: true
      privileges:
        - read
        - write
        - admin                       # Full management access

      vault_path: secret/data/messaging/rabbitmq/dev/admin

    # ---------------------------------------------------------------------------
    # Advanced Examples
    # ---------------------------------------------------------------------------

    # Multiple databases for the same user
    - type: postgresql
      host: postgres-cluster.example.com
      port: 5432
      database: app_db_1

      admin_vault_path: secret/data/databases/admin/postgres/cluster

      username: multi_db_user
      password: shared_password_across_dbs
      privileges:
        - read
        - write

      vault_path: secret/data/databases/cluster/app_db_1

    - type: postgresql
      host: postgres-cluster.example.com
      port: 5432
      database: app_db_2

      admin_vault_path: secret/data/databases/admin/postgres/cluster

      username: multi_db_user         # Same user, different database
      password: shared_password_across_dbs
      privileges:
        - read
        - write

      vault_path: secret/data/databases/cluster/app_db_2

  # =============================================================================
  # REMOVE DATABASE USERS
  # =============================================================================
  remove:
    # Remove users from databases
    - type: postgresql
      host: postgres.example.com
      port: 5432
      database: old_app

      admin_vault_path: secret/data/databases/admin/postgres/prod

      username: deprecated_user

    - type: mysql
      host: mysql.example.com
      port: 3306
      database: legacy_db

      admin_user: root
      admin_pass: ${MYSQL_ROOT_PASSWORD}

      username: old_user

    - type: rabbitmq
      host: rabbitmq.example.com
      port: 5672
      vhost: /staging

      admin_vault_path: secret/data/databases/admin/rabbitmq/prod

      username: test_user

# =============================================================================
# PRIVILEGE REFERENCE
# =============================================================================
#
# PostgreSQL:
#   - read:  SELECT on all tables in the database
#   - write: SELECT, INSERT, UPDATE, DELETE on all tables
#   - admin: ALL PRIVILEGES on the database
#
# MySQL:
#   - read:  SELECT on the database
#   - write: SELECT, INSERT, UPDATE, DELETE on the database
#   - admin: ALL PRIVILEGES on the database
#
# MongoDB:
#   - read:  read role on the database
#   - write: readWrite role on the database
#   - admin: dbAdmin role on the database
#
# RabbitMQ:
#   - read:  Can consume messages from queues in the vhost
#   - write: Can publish messages to exchanges in the vhost
#   - admin: Full management access (configure, read, write)
#
# =============================================================================
# ADMIN CREDENTIALS RESOLUTION ORDER
# =============================================================================
#
# stackctl resolves admin credentials in the following priority:
#
# 1. Explicit values (admin_user + admin_pass)
# 2. Environment variables (${VAR_NAME})
# 3. Vault path (admin_vault_path)
#
# Vault path format:
#   secret/data/databases/admin/<type>/<environment>
#
# Expected keys in Vault:
#   - username: admin username
#   - password: admin password
#
# =============================================================================
# AUTO-GENERATED PASSWORDS
# =============================================================================
#
# When auto_generate_pass: true, stackctl generates:
#   - 32 characters long
#   - Mix of uppercase, lowercase, numbers, and symbols
#   - Cryptographically secure random generation
#
# Generated passwords are automatically stored in Vault at the specified
# vault_path with keys:
#   - username: the database username
#   - password: the generated password
#
# =============================================================================
# EXAMPLES BY USE CASE
# =============================================================================
#
# 1. Development Environment:
#    - Use explicit admin credentials
#    - Use auto_generate_pass for convenience
#    - Store in Vault for team sharing
#
# 2. Staging Environment:
#    - Use environment variables for admin credentials
#    - Use auto_generate_pass
#    - Store in Vault with staging prefix
#
# 3. Production Environment:
#    - Use admin_vault_path for admin credentials
#    - Use auto_generate_pass for security
#    - Store in Vault with production prefix
#    - Use read-only users for reporting/analytics
#    - Use read-write users for applications
#    - Use admin users sparingly
#
# =============================================================================
